name: Sincronizar Tupi

on:
  schedule:
    # Segunda-feira 09:15 UTC = 06:15 em Brasília: baixa a semana anterior (seg a dom) + 1 dia de sobra.
    - cron: "15 9 * * 1"
    # Quinta-feira: só uma consulta leve ao Supabase, para o plano gratuito não pausar o projeto.
    - cron: "15 9 * * 4"
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial AAAA-MM-DD (vazio = últimos 8 dias)"
        required: false
      fim:
        description: "Data final AAAA-MM-DD (vazio = ontem)"
        required: false

concurrency:
  group: sync-tupi
  cancel-in-progress: false

permissions:
  contents: read

# O repositório é público: os CSVs (com dados de clientes) NÃO são guardados como artefato.

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar histórico da Tupi e gravar no Supabase
        env:
          TUPI_EMAIL: ${{ secrets.TUPI_EMAIL }}
          TUPI_SENHA: ${{ secrets.TUPI_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESTACAO_PREFIXO: ${{ vars.ESTACAO_PREFIXO }}
          ESTACAO_INICIO: ${{ vars.ESTACAO_INICIO }}
          ESTACAO_FIM: ${{ vars.ESTACAO_FIM }}
          ESTACAO_DIGITOS: ${{ vars.ESTACAO_DIGITOS }}
          JANELA_DIAS: ${{ vars.JANELA_DIAS }}
          AGENDA: ${{ github.event.schedule }}
          INICIO: ${{ inputs.inicio }}
          FIM: ${{ inputs.fim }}
        run: |
          if [ "$AGENDA" = "15 9 * * 4" ]; then
            python sync_tupi.py --manter-ativo
            exit 0
          fi
          ARGS=()
          if [ -n "$INICIO" ]; then ARGS+=(--inicio "$INICIO"); fi
          if [ -n "$FIM" ]; then ARGS+=(--fim "$FIM"); fi
          python sync_tupi.py "${ARGS[@]}"
